<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090d">

    <title>Loomina — Profile</title>
    <meta name="description" content="Loomina's socials, all in one place.">

    <style>
        :root {
            color-scheme: dark;
            --text: #f6f4ff;
            --muted: #aaa6b8;
            --accent: #b794ff;
            --accent-strong: #7b4cff;
            --surface: rgba(14, 12, 21, 0.68);
            --surface-hover: rgba(255, 255, 255, 0.11);
            --border: rgba(255, 255, 255, 0.13);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: #09090d;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 15%, rgba(123, 76, 255, 0.27), transparent 31rem),
                radial-gradient(circle at 80% 82%, rgba(212, 100, 255, 0.18), transparent 28rem),
                linear-gradient(145deg, #11101a 0%, #07070b 52%, #0c0910 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.22;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: linear-gradient(to bottom, black, transparent 82%);
        }

        .glow {
            position: fixed;
            width: 28rem;
            aspect-ratio: 1;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(137, 86, 255, 0.14);
            filter: blur(90px);
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 18px;
        }

        .profile-card {
            width: min(100%, 620px);
            padding: 48px 42px 30px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 32px 90px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(125%);
            -webkit-backdrop-filter: blur(24px) saturate(125%);
            animation: card-in 650ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .avatar-wrap {
            position: relative;
            width: fit-content;
            margin: 0 auto 19px;
        }

        .avatar {
            width: 112px;
            height: 112px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 43px;
            font-weight: 800;
            letter-spacing: -0.06em;
            background: linear-gradient(145deg, #c8a9ff, #7841eb 62%, #261245);
            box-shadow: 0 0 0 7px rgba(183, 148, 255, 0.07), 0 16px 40px rgba(71, 28, 150, 0.5);
            user-select: none;
        }

        .status-dot {
            position: absolute;
            right: 5px;
            bottom: 6px;
            width: 19px;
            height: 19px;
            border: 4px solid #17131f;
            border-radius: 50%;
            background: #66e49a;
            box-shadow: 0 0 15px rgba(102, 228, 154, 0.75);
        }

        h1 {
            font-size: clamp(2.1rem, 7vw, 3.15rem);
            line-height: 1;
            letter-spacing: -0.055em;
            text-shadow: 0 0 28px rgba(183, 148, 255, 0.18);
        }

        .handle {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .verified {
            width: 17px;
            height: 17px;
            display: inline-grid;
            place-items: center;
            border-radius: 50%;
            color: #0d0915;
            background: var(--accent);
            font-size: 11px;
            font-weight: 900;
        }

        .bio {
            max-width: 420px;
            margin: 18px auto 0;
            color: #d2cfda;
            font-size: 1rem;
            line-height: 1.65;
        }

        .tag-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 22px 0 28px;
        }

        .tag {
            padding: 7px 11px;
            border: 1px solid rgba(183, 148, 255, 0.2);
            border-radius: 999px;
            color: #d8c7ff;
            background: rgba(123, 76, 255, 0.09);
            font-size: 0.76rem;
            font-weight: 650;
            letter-spacing: 0.025em;
        }

        .socials {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 10px;
        }

        .social {
            position: relative;
            min-height: 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #dedbe7;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.095);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.045);
            transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, color 180ms ease;
        }

        .social:hover,
        .social:focus-visible {
            transform: translateY(-4px);
            color: white;
            border-color: rgba(183, 148, 255, 0.43);
            background: var(--surface-hover);
            outline: none;
        }

        .social-icon {
            font-size: 1.12rem;
            font-weight: 850;
            line-height: 1;
        }

        .social-name {
            font-size: 0.67rem;
            color: #9e9aa9;
        }

        .footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 25px;
            padding-top: 21px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #777381;
            font-size: 0.75rem;
        }

        .accent-mark {
            color: var(--accent);
        }

        .enter-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(5, 5, 8, 0.82);
            backdrop-filter: blur(18px);
            transition: opacity 480ms ease, visibility 480ms ease;
        }

        .enter-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .enter-button {
            padding: 14px 20px;
            color: var(--text);
            font: inherit;
            font-size: 0.83rem;
            font-weight: 720;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.17);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 45px rgba(123, 76, 255, 0.2);
            transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
        }

        .enter-button:hover,
        .enter-button:focus-visible {
            transform: scale(1.04);
            border-color: rgba(183, 148, 255, 0.55);
            background: rgba(183, 148, 255, 0.11);
            outline: none;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(18px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 560px) {
            .profile-card {
                padding: 38px 20px 24px;
                border-radius: 24px;
            }

            .socials {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .social:last-child:nth-child(3n + 2) {
                grid-column: span 2;
            }

            .footer-row {
                justify-content: center;
            }

            .footer-row span:last-child {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="glow" aria-hidden="true"></div>

    <div class="enter-screen" id="enter-screen">
        <button class="enter-button" id="enter-button" type="button">Enter Loomina</button>
    </div>

    <main class="page">
        <article class="profile-card" aria-labelledby="profile-name">
            <div class="avatar-wrap">
                <div class="avatar" aria-label="Loomina avatar">L</div>
                <span class="status-dot" title="Online" aria-label="Online"></span>
            </div>

            <h1 id="profile-name">Loomina</h1>
            <p class="handle">
                @loomina
                <span class="verified" aria-label="Verified">✓</span>
            </p>

            <p class="bio">Welcome to my corner of the internet <span class="accent-mark">✦</span></p>

            <div class="tag-row" aria-label="Profile tags">
                <span class="tag">CREATOR</span>
                <span class="tag">STREAMER</span>
                <span class="tag">GAMING</span>
            </div>

            <nav class="socials" aria-label="Social links">
                <a class="social" href="https://www.twitch.tv/JOUWNAAM" target="_blank" rel="noopener noreferrer" aria-label="Twitch">
                    <span class="social-icon" aria-hidden="true">T</span>
                    <span class="social-name">Twitch</span>
                </a>
                <a class="social" href="https://www.youtube.com/@JOUWNAAM" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                    <span class="social-icon" aria-hidden="true">▶</span>
                    <span class="social-name">YouTube</span>
                </a>
                <a class="social" href="https://www.tiktok.com/@JOUWNAAM" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
                    <span class="social-icon" aria-hidden="true">♪</span>
                    <span class="social-name">TikTok</span>
                </a>
                <a class="social" href="https://www.instagram.com/JOUWNAAM" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <span class="social-icon" aria-hidden="true">◎</span>
                    <span class="social-name">Instagram</span>
                </a>
                <a class="social" href="https://discord.gg/JOUWLINK" target="_blank" rel="noopener noreferrer" aria-label="Discord">
                    <span class="social-icon" aria-hidden="true">D</span>
                    <span class="social-name">Discord</span>
                </a>
            </nav>

            <footer class="footer-row">
                <span>loomina<span class="accent-mark">.me</span></span>
                <span>all links in one place</span>
            </footer>
        </article>
    </main>

    <script>
        const enterScreen = document.getElementById('enter-screen');
        const enterButton = document.getElementById('enter-button');

        enterButton.addEventListener('click', () => {
            enterScreen.classList.add('hidden');
        });
    </script>
</body>
</html>
